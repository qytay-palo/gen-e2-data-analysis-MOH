name: Data Quality Checks

on:
  schedule:
    # Run daily at 2 AM Singapore time (6 PM UTC previous day)
    - cron: '0 18 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    paths:
      - 'data/**'
      - 'src/data_processing/**'
      - '.github/workflows/data_quality_checks.yml'

jobs:
  data-validation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run data quality checks
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python -m pytest tests/data/ -v --tb=short
      
      - name: Generate data quality report
        if: always()
        run: |
          python scripts/generate_data_quality_report.py
      
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: data-quality-report
          path: results/metrics/data_quality_report.html
          retention-days: 30
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "Data quality checks failed. Review the artifacts for details."
