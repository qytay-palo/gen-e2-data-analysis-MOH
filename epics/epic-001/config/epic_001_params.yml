# Epic 001: Analysis Parameters
# Tunable parameters for experimentation

# Utilization Analysis Parameters
utilization_analysis:
  # Thresholds for utilization categorization
  thresholds:
    critical_low: 30.0   # < 30% needs investigation
    low: 50.0            # 30-50% underutilized
    optimal_min: 70.0    # 70-85% optimal range
    optimal_max: 85.0
    high: 90.0           # 85-90% high utilization
    critical_high: 95.0  # > 95% critical bottleneck
  
  # Capacity planning assumptions
  capacity:
    bed_days_per_year: 365
    target_utilization: 0.80  # Target 80% utilization
    buffer_capacity: 0.15     # Maintain 15% buffer
    
  # Trend analysis
  trend:
    min_years_for_trend: 3
    significant_growth_rate: 2.0  # > 2% annual growth is significant
    
# Bottleneck Detection Parameters
bottleneck_detection:
  # Severity scoring weights
  severity_weights:
    utilization_rate: 0.4   # Weight for utilization rate
    volume: 0.3             # Weight for patient volume
    growth_rate: 0.3        # Weight for growth trend
  
  # Filtering criteria
  filters:
    min_utilization: 90.0
    min_patient_volume: 1000
    min_years_of_data: 2
  
  # Classification
  priority_levels:
    immediate: 95.0   # > 95% utilization
    urgent: 92.0      # 92-95%
    high: 90.0        # 90-92%
    
# Statistical Analysis Parameters
statistical_tests:
  confidence_level: 0.95
  significance_alpha: 0.05
  
  # Outlier detection
  outlier_detection:
    method: "iqr"  # Options: iqr, zscore, isolation_forest
    iqr_multiplier: 1.5
    zscore_threshold: 3.0
    
# Performance Benchmarking
benchmarking:
  # Peer group definition
  peer_groups:
    hospital_type:
      - acute_care
      - community_hospital
      - specialty_center
    
  # Benchmarking metrics
  metrics:
    - utilization_rate
    - patient_throughput
    - average_length_of_stay
    - bed_turnover_rate
  
  # Performance tiers (percentiles)
  tiers:
    excellent: 90  # Top 10%
    good: 75       # Top 25%
    average: 50    # Middle 50%
    below_avg: 25  # Bottom 25%
    poor: 10       # Bottom 10%

# Recommendation Generation
recommendations:
  # Capacity expansion thresholds
  capacity_expansion:
    trigger_utilization: 95.0
    min_new_beds: 5
    max_new_beds: 50
    
  # Process optimization triggers
  process_optimization:
    trigger_utilization: 90.0
    expected_improvement: 5.0  # Expected 5% improvement
    
  # Resource reallocation
  resource_reallocation:
    min_utilization_gap: 20.0  # Min gap between facilities
    
# Validation Rules
validation:
  data_quality:
    max_missing_pct: 0.05      # Max 5% missing values
    min_records_per_facility: 1
    require_recent_data: True
    recent_data_years: 2
    
  business_rules:
    min_beds: 1
    max_beds: 5000
    min_utilization: 0.0
    max_utilization: 200.0  # Allow up to 200% for validation
