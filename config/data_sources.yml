# Data Sources Configuration
# MOH Healthcare Analytics Project

# Primary Data Source
kaggle:
  dataset_id: "subhamjain/health-dataset-complete-singapore"
  download_path: "data/1_raw/kaggle"
  
  # Kaggle API credentials (use environment variables)
  username: "${KAGGLE_USERNAME}"
  api_key: "${KAGGLE_KEY}"
  
  # Download settings
  auto_download: false
  force_redownload: false
  verify_checksum: true

# Data Categories
datasets:
  healthcare_workforce:
    tables:
      - "dentists_by_age_group_and_sex.csv"
      - "doctors_by_age_group_and_sex.csv"
      - "nurses_by_age_group_and_sex.csv"
      - "pharmacists_by_age_group_and_sex.csv"
    time_span: "2006-2019"
    record_count: 390
    
  healthcare_facilities:
    tables:
      - "number_of_hospital_beds.csv"
      - "number_of_polyclinics.csv"
      - "number_of_hospitals.csv"
    time_span: "2009-2020"
    record_count: 408
    
  health_outcomes:
    tables:
      - "principal_causes_of_death.csv"
      - "life_expectancy.csv"
      - "infant_mortality_rate.csv"
    time_span: "1990-2019"
    record_count: 90
    
  public_health:
    tables:
      - "immunisation_coverage.csv"
      - "health_screening_participation.csv"
      - "smoking_prevalence.csv"
    time_span: "2003-2020"
    record_count: 213
    
  healthcare_utilization:
    tables:
      - "hospital_admissions.csv"
      - "polyclinic_attendances.csv"
      - "emergency_department_visits.csv"
    time_span: "2006-2020"
    record_count: 353
    
  expenditure:
    tables:
      - "healthcare_expenditure.csv"
    time_span: "2006-2018"
    record_count: 13

# External Reference Data (if needed)
external:
  population_data:
    source: "data.gov.sg"
    url: "https://data.gov.sg/dataset/resident-population"
    format: "csv"
    update_frequency: "annual"
    
  geographic_data:
    source: "OneMap API"
    url: "https://www.onemap.gov.sg/api/"
    api_version: "v2"
    authentication_required: false

# Data Quality Expectations
data_quality:
  completeness_threshold: 0.95  # 95% completeness required
  timeliness_days: 30  # Data should be within 30 days
  consistency_checks: true
  
  # Validation rules
  validations:
    - name: "no_negative_values"
      columns: ["count", "rate", "expenditure"]
    - name: "valid_date_range"
      min_year: 1990
      max_year: 2026
    - name: "no_duplicates"
      key_columns: ["year", "category"]

# Data Refresh Schedule
refresh:
  enabled: false  # Manual refresh for now
  frequency: "monthly"
  next_refresh: "2026-03-01"
