# Disease Prioritization Framework Configuration
# Last Updated: 2026-02-12
# Purpose: Multi-criteria disease burden prioritization settings

# Base Case Weighting Scheme
# Weights must sum to 1.0 (100%)
# Based on stakeholder input and domain knowledge
base_case:
  weights:
    volume: 0.40      # Case volume (40%) - absolute burden
    trend: 0.25       # Trend direction (25%) - emerging threats
    outbreak: 0.20    # Outbreak risk (20%) - surge capacity needs
    variability: 0.15 # Variability (15%) - predictability
  
  # Tier Assignment Thresholds
  tier_thresholds:
    high: 70.0        # High Priority: score > 70
    medium: 40.0      # Medium Priority: 40 <= score <= 70
                      # Low Priority: score < 40

# Alternative Weighting Scenarios for Sensitivity Analysis
scenarios:
  # Scenario 1: Volume-Focused (prioritize high case burden)
  volume_focused:
    weights:
      volume: 0.60
      trend: 0.20
      outbreak: 0.10
      variability: 0.10
    description: "Emphasizes absolute case burden, suitable for resource allocation based on current impact"
  
  # Scenario 2: Emerging Threat-Focused (prioritize growing diseases)
  emerging_threat_focused:
    weights:
      volume: 0.30
      trend: 0.50
      outbreak: 0.15
      variability: 0.05
    description: "Emphasizes trend analysis, suitable for proactive intervention planning"
  
  # Scenario 3: Stability-Focused (prioritize predictability and outbreak control)
  stability_focused:
    weights:
      volume: 0.30
      trend: 0.20
      outbreak: 0.30
      variability: 0.20
    description: "Balances outbreak risk and variability, suitable for surge capacity planning"

# Metric Mappings
# Maps criteria to specific burden metric columns
metrics:
  volume_metrics:
    - total_cases_score
    - annual_avg_cases_score
  trend_metrics:
    - cagr_score
  outbreak_metrics:
    - outbreak_frequency_score
    - outbreak_intensity_score
  variability_metrics:
    - coefficient_variation_score

# Composite Score Calculation Method
scoring:
  method: "weighted_sum"
  scale: [0, 100]
  aggregation:
    volume: "mean"        # Average of volume metrics
    trend: "direct"       # Use cagr_score directly
    outbreak: "mean"      # Average of outbreak metrics (if multiple)
    variability: "direct" # Use coefficient_variation_score directly

# Data Filtering Criteria
data_filters:
  sufficient_data_required: true
  min_non_zero_weeks: 50  # Minimum weeks with non-zero cases

# Output Settings
output:
  rankings_file: "results/tables/disease_priority_rankings.csv"
  sensitivity_file: "results/tables/sensitivity_analysis.csv"
  figures_dir: "results/figures"
  include_metadata: true
  timestamp_format: "%Y-%m-%d %H:%M:%S"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
