# Automated Analysis Configuration
# Defines which datasets to analyze and what analyses to run

analysis_schedules:
  # Healthcare workforce analysis
  workforce_analysis:
    enabled: true
    datasets:
      - "data/1_raw/kaggle/dentists_by_age_group_and_sex.csv"
      - "data/1_raw/kaggle/doctors_by_age_group_and_sex.csv"
      - "data/1_raw/kaggle/nurses_by_age_group_and_sex.csv"
      - "data/1_raw/kaggle/pharmacists_by_age_group_and_sex.csv"
    analysis_types:
      - explore
      - analyze
      - validate
    output_format:
      - json
      - markdown
    
  # Healthcare facilities analysis
  facilities_analysis:
    enabled: true
    datasets:
      - "data/1_raw/kaggle/number_of_hospital_beds.csv"
      - "data/1_raw/kaggle/number_of_polyclinics.csv"
      - "data/1_raw/kaggle/number_of_hospitals.csv"
    analysis_types:
      - explore
      - validate
    output_format:
      - json
      - markdown
  
  # Health outcomes analysis
  outcomes_analysis:
    enabled: true
    datasets:
      - "data/1_raw/kaggle/principal_causes_of_death.csv"
      - "data/1_raw/kaggle/life_expectancy.csv"
      - "data/1_raw/kaggle/infant_mortality_rate.csv"
    analysis_types:
      - explore
      - analyze
      - validate
    output_format:
      - json
      - markdown
  
  # Public health analysis
  public_health_analysis:
    enabled: true
    datasets:
      - "data/1_raw/kaggle/immunisation_coverage.csv"
      - "data/1_raw/kaggle/health_screening_participation.csv"
      - "data/1_raw/kaggle/smoking_prevalence.csv"
    analysis_types:
      - explore
      - analyze
      - validate
    output_format:
      - json
      - markdown

# Analysis parameters
parameters:
  # Missing value threshold for warnings
  missing_value_warning_threshold: 20.0  # percentage
  
  # Correlation threshold for reporting
  correlation_threshold: 0.7
  
  # Outlier detection method
  outlier_method: "iqr"  # interquartile range
  outlier_sensitivity: 1.5
  
  # Duplicate detection
  duplicate_warning_threshold: 5.0  # percentage
  
  # Cardinality thresholds
  high_cardinality_threshold: 0.95  # consider as unique identifier
  low_cardinality_threshold: 0.05   # consider encoding

# Output settings
output:
  save_json: true
  save_markdown: true
  save_html: false
  generate_visualizations: true
  
  # Paths (relative to project root)
  results_dir: "results/metrics"
  reports_dir: "reports"
  figures_dir: "reports/figures"

# Logging
logging:
  level: "INFO"
  save_to_file: true
  file_path: "logs/audit/auto_analysis.log"
